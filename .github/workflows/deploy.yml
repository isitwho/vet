name: Deploy Quartz Site

on:
  push:
    branches:
      - v4  
  workflow_dispatch:
  schedule:
    - cron: '0 11 11 11 11 ?' # Every hour

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Private Vault
        uses: actions/checkout@v4
        with:
          repository: isitwho/obsidian_vet
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: temp_content
          fetch-depth: 0

      - name: Sync content
        run: |
          find content/ -mindepth 1 ! -name 'index.md' -delete
          
          # Restore timestamps in temp_content
          cd temp_content
          git ls-files -z | xargs -0 -n1 -I{} bash -c 'touch -d @$(git log -1 --format=%ct -- "{}") "{}"'
          cd ..
          
          rsync -av --exclude='.git' temp_content/ content/
          rm -rf temp_content
          export TZ='Asia/Seoul'
          echo -e "\n\n_Last Update: $(date '+%Y-%m-%d %H:%M:%S')_" >> content/index.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
